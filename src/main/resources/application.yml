spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password:
    url: jdbc:mysql://localhost:3306/chat_agent?useSSL=false&serverTimezone=UTC
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        enable-thinking: true
        model: qwen3.5:9b
      embedding:
        options:
          model: nomic-embed-text   # RAG 向量模型，需 ollama pull nomic-embed-text
    mcp:
      server:
        name: agent-demo-mcp-server
        version: 1.0.0
        type: SYNC
        enabled: true               # SSE 地址：http://localhost:8080/api/sse
      client:
        enabled: false              # 接入外部 MCP 服务时打开
        # type: SYNC
        # toolcallback:
        #   enabled: true
        # sse:
        #   connections:
        #     agent-demo:            # 示例：接入本应用自己暴露的 MCP Server
        #       url: http://localhost:8080
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  chat:
    memory:
      repository:
        redis:
          host: localhost
          port: 6379
          time-to-live: 24h
          initialize-schema: true
          index-name: chat-memory-idx
  application:
    name: agent_demo
data:
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 10s
    connect-timeout: 10s
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL
  global-config:
    db-config:
      id-type: assign_uuid
server:
  port: 8080
  servlet:
    context-path: /api
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.he.agent_demo.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug

agent:
  vision-model: qwen2.5vl:7b        # 多模态图片理解模型，需 ollama pull qwen2.5vl:7b
  vector-store-path: data/vectorstore.json