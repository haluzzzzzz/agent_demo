spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3.5:9b
  chat:
    memory:
      repository:
        redis:
          host: localhost
          port: 6379
          time-to-live: 24h
          initialize-schema: true
          index-name: chat-memory-idx
  application:
    name: agent_demo
data:
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 10s
    connect-timeout: 10s

server:
  port: 8080
  servlet:
    context-path: /api
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.he.agent_demo.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug