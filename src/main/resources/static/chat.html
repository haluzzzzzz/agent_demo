<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手 - SpringAI+Ollama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        sidebar: '#111827',
                        chatBg: '#f7f8fa',
                        userBubble: '#2563eb',
                        aiBubble: '#ffffff',
                        thinkBg: '#f3f4f6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            },
            darkMode: false
        }
    </script>
    <style>
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
        .chat-container {
            height: calc(100vh - 170px);
        }
        .think-block.streaming::after,
        .ans-block.streaming::after {
            content: '▍';
            display: inline-block;
            animation: blink 1s step-start infinite;
            color: #9ca3af;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-50 overflow-hidden">
<div class="flex h-screen">
    <!-- 左侧会话栏 -->
    <aside class="w-64 bg-sidebar text-white flex flex-col">
        <div class="p-4 border-b border-gray-700">
            <button onclick="createNewSession()"
                    class="w-full bg-primary hover:bg-blue-700 rounded-lg py-2 px-3 flex items-center justify-center gap-2 transition">
                <i class="fa fa-plus"></i>新建对话
            </button>
        </div>
        <div id="sessionList" class="flex-1 overflow-y-auto p-2 space-y-1">
            <!-- 会话列表动态渲染 -->
        </div>
    </aside>

    <!-- 主聊天区域 -->
    <main class="flex-1 flex flex-col">
        <!-- 头部 -->
        <header class="h-14 border-b flex items-center px-4 bg-white">
            <h2 class="text-lg font-medium">AI对话助手</h2>
        </header>

        <!-- 聊天内容 -->
        <div id="chatBox" class="chat-container overflow-y-auto p-4 space-y-4">
            <!-- 消息动态渲染 -->
        </div>

        <!-- 输入区域 -->
        <div class="border-t bg-white p-4">
            <div class="max-w-4xl mx-auto">
                <textarea id="input"
                          class="w-full border rounded-lg p-3 resize-none h-24 focus:outline-none focus:ring-2 focus:ring-blue-300"
                          placeholder="请输入消息，Shift+Enter换行，Enter发送"></textarea>
                <div class="flex justify-end items-center mt-2">
                    <div class="flex gap-2">
                        <button onclick="stopStream()" class="px-4 py-2 rounded-lg border hover:bg-gray-100">停止生成</button>
                        <button onclick="sendMessage()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700">发送</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    // DOM元素
    const inputEl = document.getElementById("input");
    const chatBox = document.getElementById("chatBox");
    const sessionListEl = document.getElementById("sessionList");

    // 当前会话
    let currentSessionId = null;
    let abortController = null; // 终止fetch流式请求
    const SESSION_STORAGE_KEY = "agent_chat_sessions";
    const THINK_PREVIEW_LEN = 60; // 折叠预览：最多展示开头60字符

    // 页面加载初始化
    window.onload = () => {
        loadSessionsFromLocal();
        if (!currentSessionId) {
            createNewSession();
        }
    }

    // 新建会话
    function createNewSession() {
        const sessionId = crypto.randomUUID();
        currentSessionId = sessionId;
        saveSessionToLocal(sessionId, "新对话");
        renderSessionList();
        chatBox.innerHTML = "";
    }

    // 本地存储会话列表
    function getLocalSessions() {
        const data = localStorage.getItem(SESSION_STORAGE_KEY);
        return data ? JSON.parse(data) : {};
    }

    function saveSessionToLocal(sessionId, title) {
        const sessions = getLocalSessions();
        sessions[sessionId] = {
            title: title,
            createTime: new Date().toLocaleString()
        }
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(sessions));
    }

    function deleteSessionLocal(sessionId) {
        const sessions = getLocalSessions();
        delete sessions[sessionId];
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(sessions));
        if (currentSessionId === sessionId) {
            createNewSession();
        }
        renderSessionList();
        chatBox.innerHTML = "";
    }

    function loadSessionsFromLocal() {
        const sessions = getLocalSessions();
        const keys = Object.keys(sessions);
        if (keys.length > 0) {
            currentSessionId = keys[0];
        }
        renderSessionList();
    }

    // 渲染左侧会话列表
    function renderSessionList() {
        const sessions = getLocalSessions();
        sessionListEl.innerHTML = "";
        Object.keys(sessions).forEach(id => {
            const item = sessions[id];
            const div = document.createElement("div");
            div.className = `flex justify-between items-center p-2 rounded cursor-pointer ${currentSessionId === id ? 'bg-gray-700' : 'hover:bg-gray-800'}`;
            div.innerHTML = `
                <span class="truncate text-sm">${item.title}</span>
                <i class="fa fa-times text-gray-400 hover:text-red-400" onclick="event.stopPropagation();deleteSessionLocal('${id}')"></i>
            `;
            div.onclick = () => {
                currentSessionId = id;
                renderSessionList();
                loadHistoryMsg(id);
            }
            sessionListEl.appendChild(div);
        })
    }

    // 加载历史消息（后端接口）
    async function loadHistoryMsg(sessionId) {
        try {
            const resp = await fetch(`/api/chat/history?sessionId=${sessionId}`);
            const msgs = await resp.json();
            chatBox.innerHTML = "";
            msgs.forEach(msg => {
                if (msg.role === "USER") {
                    addUserMsg(msg.content);
                } else if (msg.role === "ASSISTANT") {
                    addAiMsg(msg.content, false);
                }
            })
        } catch (e) {
            console.error("加载历史失败", e);
            chatBox.innerHTML = "";
        }
    }

    // 渲染用户消息气泡
    function addUserMsg(text) {
        const div = document.createElement("div");
        div.className = "flex justify-end";
        div.innerHTML = `
            <div class="bg-userBubble text-white px-4 py-2 rounded-xl max-w-2xl whitespace-pre-wrap">${escapeHtml(text)}</div>
        `
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 渲染AI消息气泡
    function addAiMsg(text, isStreaming = true) {
        const wrapper = document.createElement("div");
        wrapper.className = "flex justify-start";
        wrapper.innerHTML = `
        <div class="bg-aiBubble border rounded-xl p-4 max-w-2xl">
            <!-- 思考标题栏：折叠时展示开头预览文字 -->
            <div class="think-header flex items-center cursor-pointer text-sm text-gray-500 mb-2" onclick="toggleThink(this)">
                <i class="fa fa-caret-right mr-1 transition-transform duration-200"></i>
                <span>思考过程：</span>
                <span class="think-preview text-gray-400 italic"></span>
            </div>
            <!-- 完整思考面板，默认隐藏 -->
            <div class="think-block bg-thinkBg p-2 rounded mb-3 text-sm text-gray-400 whitespace-pre-wrap hidden"></div>
            <div class="ans-block whitespace-pre-wrap"></div>
        </div>
        `
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
        return {
            thinkPreview: wrapper.querySelector(".think-preview"),
            thinkBlock: wrapper.querySelector(".think-block"),
            ansDom: wrapper.querySelector(".ans-block"),
            thinkHeader: wrapper.querySelector(".think-header"),
            fullThinkText: "" // 保存本条完整思考文本
        }
    }

    // 切换单个思考面板展开/收起
    function toggleThink(headerEl) {
        const icon = headerEl.querySelector("i");
        const previewSpan = headerEl.querySelector(".think-preview");
        const thinkBlock = headerEl.nextElementSibling;
        const fullText = thinkBlock.dataset.fulltext || "";

        if (thinkBlock.classList.contains("hidden")) {
            // 展开：显示全部思考，预览文字隐藏
            thinkBlock.classList.remove("hidden");
            icon.classList.remove("fa-caret-right");
            icon.classList.add("fa-caret-down");
            thinkBlock.innerText = fullText;
            thinkBlock.scrollTop = thinkBlock.scrollHeight;
            previewSpan.style.display = "none";
        } else {
            // 折叠：隐藏完整面板，截取【开头】字符展示预览
            thinkBlock.classList.add("hidden");
            icon.classList.remove("fa-caret-down");
            icon.classList.add("fa-caret-right");
            previewSpan.style.display = "inline";
            if(fullText.length > THINK_PREVIEW_LEN){
                previewSpan.innerText = fullText.slice(0, THINK_PREVIEW_LEN) + "……";
            }else{
                previewSpan.innerText = fullText;
            }
        }
    }

    async function sendMessage() {
        const content = inputEl.value.trim();
        if (!content || !currentSessionId) return;
        addUserMsg(content);
        inputEl.value = "";

        const msgItem = addAiMsg("", true);
        msgItem.thinkBlock.classList.add("streaming");
        msgItem.ansDom.classList.add("streaming");
        abortController = new AbortController();

        try {
            const res = await fetch("/api/chat/stream", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({sessionId: currentSessionId, content: content}),
                signal: abortController.signal
            })
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let eventName = "";

            while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, {stream: true});
                const lines = buffer.split("\n");
                buffer = lines.pop();

                for (const line of lines) {
                    if (line.startsWith("event:")) {
                        eventName = line.replace("event:", "").trim();
                    } else if (line.startsWith("data:")) {
                        const dataStr = line.slice(5);
                        if (eventName === "thinking") {
                            // 持续拼接完整思考文本
                            msgItem.fullThinkText += dataStr;
                            msgItem.thinkBlock.dataset.fulltext = msgItem.fullThinkText;

                            if(msgItem.thinkBlock.classList.contains("hidden")){
                                // ✅ 折叠：截取开头N个字符 + 省略号
                                let preview = msgItem.fullThinkText;
                                if(preview.length > THINK_PREVIEW_LEN){
                                    preview = preview.slice(0, THINK_PREVIEW_LEN) + "……";
                                }
                                msgItem.thinkPreview.innerText = preview;
                            }else{
                                // 展开状态：渲染全部文本
                                msgItem.thinkBlock.innerText = msgItem.fullThinkText;
                                msgItem.thinkBlock.scrollTop = msgItem.thinkBlock.scrollHeight;
                            }
                        } else if (eventName === "answer") {
                            msgItem.ansDom.innerText += dataStr;
                            const sessions = getLocalSessions();
                            if (sessions[currentSessionId].title === "新对话") {
                                const title = msgItem.ansDom.innerText.substring(0, 18);
                                saveSessionToLocal(currentSessionId, title);
                                renderSessionList();
                            }
                        }
                    } else if (line === "") {
                        eventName = "";
                    }
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        } catch (err) {
            if (err.name !== "AbortError") {
                msgItem.ansDom.innerText += "\n【请求中断】";
                console.error(err);
            }
        }

        msgItem.thinkBlock.classList.remove("streaming");
        msgItem.ansDom.classList.remove("streaming");
        abortController = null;
    }

    // 停止流式输出
    function stopStream() {
        if (abortController) {
            abortController.abort();
        }
    }

    // html转义防止XSS
    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Enter发送，Shift+Enter换行
    inputEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    })
</script>
</body>
</html>
