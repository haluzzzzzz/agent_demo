<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        sidebarBg: '#111827',
                        chatBg: '#ffffff',
                        userMsg: '#eff6ff',
                        aiMsg: '#f9fafb',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            },
            darkMode: 'class',
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .msg-enter {
                animation: fadeIn 0.25s ease-out;
            }
            @keyframes fadeIn {
                from {opacity:0; transform: translateY(6px);}
                to {opacity:1; transform: translateY(0);}
            }
        }
    </style>
</head>
<body class="h-screen overflow-hidden bg-gray-50 flex">
<!-- 左侧侧边栏 -->
<div id="sidebar" class="w-64 bg-sidebarBg text-white flex flex-col transition-all">
    <div class="p-3">
        <button id="newChatBtn" class="w-full py-2.5 px-4 rounded-lg border border-gray-600 hover:bg-gray-800 flex items-center gap-2 transition">
            <i class="fa fa-plus-circle"></i>
            <span>新建对话</span>
        </button>
    </div>
    <!-- 会话列表 -->
    <div id="sessionList" class="flex-1 overflow-y-auto scrollbar-hide px-2 py-1 space-y-1">
        <!-- 会话项由JS动态渲染 -->
    </div>
    <div class="p-3 border-t border-gray-700 text-xs text-gray-400">
        AI助手 · agent_chat
    </div>
</div>

<!-- 主聊天区域 -->
<div class="flex-1 flex flex-col h-full">
    <!-- 顶部标题栏 -->
    <div class="h-14 border-b flex items-center justify-between px-5 bg-white">
        <div class="font-medium text-gray-800">AI对话</div>
        <div id="currentSessionName" class="text-sm text-gray-500"></div>
    </div>

    <!-- 聊天内容容器 -->
    <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:px-20 lg:px-32 space-y-6">
        <div class="w-full h-full flex items-center justify-center text-gray-400" id="emptyTip">
            <div class="text-center">
                <div class="text-3xl mb-3">🤖</div>
                <p>你好，我是你的AI助手，请输入问题开始对话</p>
            </div>
        </div>
    </div>

    <!-- 底部输入区域 -->
    <div class="p-4 md:px-20 lg:px-32 border-t bg-white">
        <div class="relative">
                <textarea id="msgInput"
                          class="w-full border border-gray-200 rounded-xl p-3 pr-20 resize-none outline-none focus:border-primary transition"
                          rows="2"
                          placeholder="输入消息，Shift+Enter换行"></textarea>
            <div class="absolute right-2 bottom-2 flex gap-1">
                <button id="stopBtn" class="hidden px-3 py-1.5 rounded-lg bg-gray-200 hover:bg-gray-300 text-sm">
                    <i class="fa fa-stop"></i> 停止
                </button>
                <button id="sendBtn" class="px-3 py-1.5 rounded-lg bg-primary hover:bg-blue-700 text-white text-sm">
                    <i class="fa fa-paper-plane"></i> 发送
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // =========全局变量=========
    let currentSessionId = null;
    let abortController = null; // 用于中断流式请求
    let sessionList = [];
    const API_BASE = "http://localhost:8080/api/chat";

    // DOM元素
    const chatContainer = document.getElementById('chatContainer');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const sessionListDom = document.getElementById('sessionList');
    const emptyTip = document.getElementById('emptyTip');

    // 初始化
    async function init(){
        // 页面加载，从后端拉取全部会话
        await loadAllSessions();
        const lastSessionId = localStorage.getItem("ai_chat_current_session");
        if(lastSessionId && sessionList.includes(lastSessionId)){
            await switchSession(lastSessionId);
        }else{
            createNewSession();
        }

        newChatBtn.onclick = createNewSession;
        sendBtn.onclick = sendMessage;
        stopBtn.onclick = stopGenerate;
        msgInput.addEventListener('keydown', (e)=>{
            if(e.key === 'Enter' && !e.shiftKey){
                e.preventDefault();
                sendMessage();
            }
        })
    }

    // 从后端拉取全部会话列表
    async function loadAllSessions(){
        const res = await fetch(`${API_BASE}/sessions`);
        sessionList = await res.json();
        renderSessionList();
    }

    // 创建新会话
    async function createNewSession(){
        const sid = crypto.randomUUID();
        currentSessionId = sid;
        localStorage.setItem("ai_chat_current_session", sid);

        // ✅【关键1】前端数组追加新会话
        sessionList.push(sid);

        // ✅【关键2】通知后端创建会话（后端把sid存入内存）
        await fetch(`${API_BASE}/createSession`, {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({sessionId: sid})
        });

        clearChatDom();
        emptyTip.style.display = "flex";
        renderSessionList(); // 现在sessionList里面已经有sid，可以渲染出来
    }


    // 渲染左侧会话列表
    function renderSessionList(){
        sessionListDom.innerHTML = "";
        sessionList.forEach(sid=>{
            const item = document.createElement('div');
            item.className = `flex items-center justify-between px-2 py-1.5 rounded cursor-pointer group ${sid === currentSessionId ? 'bg-gray-700' : 'hover:bg-gray-800'}`;
            item.innerHTML = `
                <span class="text-sm truncate flex-1" title="${sid}">对话-${sid.substring(0,8)}</span>
                <button class="text-gray-400 hover:text-red-400 opacity-0 group-hover:opacity-100 transition" onclick="event.stopPropagation(); deleteSession('${sid}')">
                    <i class="fa fa-trash-o"></i>
                </button>
            `;
            item.onclick = ()=> switchSession(sid);
            sessionListDom.appendChild(item);
        })
    }

    // 切换会话
    async function switchSession(sid){
        currentSessionId = sid;
        localStorage.setItem("ai_chat_current_session", sid);
        renderSessionList();
        clearChatDom();
        emptyTip.style.display = "none";
        const res = await fetch(`${API_BASE}/history?sessionId=${sid}`);
        const history = await res.json();
        history.forEach(item=>{
            appendMessage(item.role, item.content);
        })
    }

    // 删除会话
    async function deleteSession(sid){
        if(!confirm("确定删除该对话？")) return;
        await fetch(`${API_BASE}/history?sessionId=${sid}`, {
            method:"DELETE"
        })
        await loadAllSessions();
        if(currentSessionId === sid){
            createNewSession();
        }
    }

    async function sendMessage(){
        const content = msgInput.value.trim();
        if(!content || abortController) return;
        msgInput.value = "";
        emptyTip.style.display = "none";

        appendMessage("USER", content);
        const aiWrapper = appendMessage("ASSISTANT", "", true);
        const aiContentDom = aiWrapper.querySelector(".msg-content");

        sendBtn.classList.add('hidden');
        stopBtn.classList.remove('hidden');
        abortController = new AbortController();

        try {
            const resp = await fetch(`${API_BASE}/stream`, {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body: JSON.stringify({
                    sessionId: currentSessionId,
                    content: content
                }),
                signal: abortController.signal
            });
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let fullText = "";

            while(true){
                const {done, value} = await reader.read();
                if(done) break;
                buffer += decoder.decode(value, {stream:true});
                const eventBlocks = buffer.split("\n\n");
                buffer = eventBlocks.pop();

                for(const block of eventBlocks){
                    if(!block.trim()) continue;
                    const lines = block.split("\n");
                    for(const line of lines){
                        if(!line.startsWith("data:")) continue;
                        const raw = line.slice(5).trim();
                        if(raw === "[DONE]") return;
                        try {
                            const obj = JSON.parse(raw);
                            fullText += obj.delta;
                            aiContentDom.innerText = fullText;
                            scrollBottom();
                        }catch(e){
                            // JSON解析失败，跳过
                        }
                    }
                }
            }
        }catch(err){
            if(err.name !== "AbortError"){
                aiContentDom.innerText += "\n\n【请求出错】" + err.message;
            }
        }finally {
            abortController = null;
            sendBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
        }
    }





    // 停止生成
    function stopGenerate(){
        if(abortController){
            abortController.abort();
        }
    }

    // 追加消息到页面
    function appendMessage(role, content, isTemp=false){
        const wrap = document.createElement('div');
        wrap.className = `msg-enter flex ${role === "USER" ? "justify-end" : "justify-start"}`;
        const bubbleClass = role === "USER"
            ? "bg-primary text-white rounded-xl rounded-br-none max-w-[70%] px-4 py-2.5"
            : "bg-aiMsg text-gray-800 rounded-xl rounded-bl-none max-w-[70%] px-4 py-2.5";
        wrap.innerHTML = `
            <div class="msg-content whitespace-pre-wrap">${content}</div>
        `
        chatContainer.appendChild(wrap);
        scrollBottom();
        return wrap;
    }

    // 滚动到底部
    function scrollBottom(){
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 清空聊天DOM
    function clearChatDom(){
        chatContainer.innerHTML = "";
    }

    init();
</script>
</body>
</html>
